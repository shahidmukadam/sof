services:
  - type: web
    runtime: python
    name: state-of-finance
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 wsgi:application
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false           # Set manually in Render dashboard — paste your Neon connection string
      - key: SOF_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
