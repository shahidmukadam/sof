services:
  - type: web
    runtime: python
    name: state-of-finance
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 wsgi:application
    healthCheckPath: /healthz
    envVars:
      - key: SOF_DATA_DIR
        value: /var/data
      - key: SOF_SECRET_KEY
        generateValue: true
    disk:
      name: state-of-finance-data
      mountPath: /var/data
      sizeGB: 1
