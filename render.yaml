databases:
  - name: state-of-finance-db
    plan: free
    databaseName: sof
    user: sof

services:
  - type: web
    runtime: python
    name: state-of-finance
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 wsgi:application
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: state-of-finance-db
          property: connectionString
      - key: SOF_SECRET_KEY
        generateValue: true
